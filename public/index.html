<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Aircon</title>
    <meta name="description" content="모두가 함께 쓰는 온라인 에어컨과 브라운 노이즈 생성기" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <h1 class="visually-hidden" data-i18n="title">온라인 에어컨</h1>

    <main>
      <div class="aircon-box">
        <p class="notice" data-notice role="status" aria-live="polite"></p>
        <p class="who" data-who role="status" aria-live="polite"></p>
        <p class="temp" data-temp role="status" aria-live="polite" aria-atomic="true"></p>

        <img src="/aircon0.png" alt="" class="aircon" width="350" />
        <img src="/aircon-fan2.png" alt="" class="aircon aircon-fan" data-fan width="350" />
        <img src="/air2.png" alt="" class="aircon air" data-air width="350" />
      </div>

      <div class="controls">
        <button type="button" class="icon-button" data-plus data-i18n-label="warmer" disabled>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="currentColor"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"
            />
          </svg>
        </button>

        <button type="button" class="icon-button" data-minus data-i18n-label="cooler" disabled>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="currentColor"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8" />
          </svg>
        </button>

        <button
          type="button"
          class="icon-button is-muted"
          data-sound
          aria-pressed="false"
          disabled
        >
          <svg
            class="icon-sound-on"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="14"
            viewBox="0 0 16 16"
            fill="currentColor"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M11.536 14.01A8.47 8.47 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-.708.707A7.48 7.48 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303z"
            />
            <path
              d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.48 5.48 0 0 1 11.025 8a5.48 5.48 0 0 1-1.61 3.89z"
            />
            <path
              d="M8.707 11.182A4.5 4.5 0 0 0 10.025 8a4.5 4.5 0 0 0-1.318-3.182L8 5.525A3.5 3.5 0 0 1 9.025 8 3.5 3.5 0 0 1 8 10.475zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06"
            />
          </svg>
          <svg
            class="icon-sound-off"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="14"
            viewBox="0 0 16 16"
            fill="currentColor"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06m7.137 2.096a.5.5 0 0 1 0 .708L12.207 8l1.647 1.646a.5.5 0 0 1-.708.708L11.5 8.707l-1.646 1.647a.5.5 0 0 1-.708-.708L10.793 8 9.146 6.354a.5.5 0 1 1 .708-.708L11.5 7.293l1.646-1.647a.5.5 0 0 1 .708 0"
            />
          </svg>
        </button>
      </div>

      <div class="controls">
        <button type="button" class="pill" data-online aria-pressed="false" disabled>온라인 모드 꺼짐</button>
      </div>
    </main>

    <footer class="footer">
      <button type="button" class="link" data-show-stats data-i18n="stats">통계</button>
      <button type="button" class="link" data-show-about data-i18n="about">정보</button>
    </footer>

    <dialog class="dialog" data-nickname-dialog>
      <form method="dialog" data-nickname-form>
        <label class="field-label" for="nickname" data-i18n="nicknameLabel">닉네임</label>
        <input
          id="nickname"
          data-nickname-input
          type="text"
          maxlength="9"
          autocomplete="off"
          enterkeyhint="go"
        />
        <button type="submit" class="pill" data-i18n="start">시작</button>
      </form>
    </dialog>

    <dialog class="dialog" data-stats-dialog>
      <p><span data-i18n="plusCount">＋ 누른 횟수</span>: <span data-plus-count>0</span></p>
      <p><span data-i18n="minusCount">－ 누른 횟수</span>: <span data-minus-count>0</span></p>
      <button type="button" class="pill" data-close-dialog data-i18n="close" autofocus>닫기</button>
    </dialog>

    <dialog class="dialog" data-about-dialog>
      <div data-about-lines></div>
      <button type="button" class="pill" data-close-dialog data-i18n="close" autofocus>닫기</button>
    </dialog>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
